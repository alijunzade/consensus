name: Icerik Uret

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Konu (örn: menopozda östrojen patchi)"
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo cek
        uses: actions/checkout@v4

      - name: Nodejs kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chromium kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser \
            fonts-liberation libappindicator3-1 \
            libatk-bridge2.0-0 libnspr4 libnss3

      - name: Bagimlilik yukle
        run: npm install

      - name: Pipeline calistir
      
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_TOPIC: ${{ inputs.topic }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          SLIDE_COUNT: "14"
        run: node pipeline.js "$CONTENT_TOPIC"
      - name: Dosyalari listele
        run: find . -name "*.png" -o -name "*.txt" | head -50

      - name: Ciktilari yukle
        uses: actions/upload-artifact@v4
        with:
          name: icerik-${{ github.run_number }}
          path: /home/runner/work/consensus/output/
          retention-days: 7

      - name: Telegram basari
        if: success()
        run: |
          TEXT="Icerik hazir! Konu: ${{ inputs.topic }} | Run: ${{ github.run_number }} | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$TEXT"

      - name: Telegram hata
        if: failure()
        run: |
          TEXT="HATA! Konu: ${{ inputs.topic }} | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$TEXT"
