<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #0E1C2F; --navy2: #132237; --teal: #1B9E8A; --teal2: #22C5AC;
  --amber: #F0A500; --amber2: #FFB830; --coral: #E07560; --rose: #C5687A;
  --green: #3A9068; --purple: #6E5FA8; --white: #FFFFFF;
  --offwhite: #EDF4F8; --beige: #F0EDE6; --muted: #7A9AB5; --dark: #1A2B40;
}
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; }

/* ── SHARED ── */
.slide-counter { position: absolute; top: 24px; right: 36px; font-size: 18px; font-weight: 500; letter-spacing: 0.1em; }
.slide-dark .slide-counter { color: rgba(255,255,255,0.3); }
.slide-light .slide-counter { color: #aaa; }

.slide-footer { position: absolute; bottom: 22px; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; }
.footer-name { font-size: 16px; font-style: italic; }
.footer-cite { font-size: 13px; font-style: italic; color: inherit; max-width: 580px; text-align: center; line-height: 1.4; }
.footer-url { font-size: 15px; font-weight: 700; letter-spacing: 0.03em; }
.slide-dark .footer-name, .slide-dark .footer-cite { color: var(--muted); }
.slide-dark .footer-url { color: var(--teal2); }
.slide-light .footer-name, .slide-light .footer-cite, .slide-light .footer-url { color: #999; }

.dot-nav { position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; opacity: 0.3; }
.dot.active { opacity: 1; }
.slide-dark .dot { background: var(--white); }
.slide-light .dot { background: var(--navy); }

.progress-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.slide-dark .progress-line { background: rgba(255,255,255,0.07); }
.slide-light .progress-line { background: rgba(0,0,0,0.07); }
.progress-fill { height: 100%; background: var(--teal); }

/* Dekoratif daireler */
.deco-tr { position: absolute; top: -55px; right: -55px; border-radius: 50%; pointer-events: none; }
.deco-bl { position: absolute; bottom: -55px; left: -55px; border-radius: 50%; pointer-events: none; }
.deco-br { position: absolute; bottom: -45px; right: -45px; border-radius: 50%; pointer-events: none; }

/* ── DARK BASE ── */
.slide-dark { width: 1080px; height: 1080px; background: var(--navy); position: relative; overflow: hidden; }
.slide-light { width: 1080px; height: 1080px; background: var(--beige); position: relative; overflow: hidden; }

/* ── TITLE DARK ── */
.title-wrap { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px 80px 100px; height: 100%; }
.title-badge { display: inline-block; background: rgba(27,158,138,0.2); border: 1px solid var(--teal); border-radius: 6px; padding: 7px 20px; font-size: 14px; font-weight: 600; color: var(--teal2); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 28px; }
.title-icon { font-size: 60px; margin-bottom: 24px; }
.title-h1 { font-family: 'Playfair Display', serif; font-size: 66px; font-weight: 700; color: var(--white); line-height: 1.1; margin-bottom: 20px; max-width: 860px; }
.title-italic { font-family: 'Playfair Display', serif; font-style: italic; font-size: 30px; color: var(--teal2); margin-bottom: 24px; }
.title-line { width: 100px; height: 3px; background: var(--teal); border-radius: 2px; margin: 0 auto 24px; }
.title-sub { font-size: 24px; color: var(--muted); font-weight: 300; line-height: 1.5; max-width: 680px; margin-bottom: 28px; }
.title-cta { border: 1.5px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 12px 36px; font-size: 22px; color: var(--offwhite); display: inline-block; }
.title-author { position: absolute; bottom: 66px; left: 50%; transform: translateX(-50%); font-size: 17px; color: var(--muted); font-style: italic; white-space: nowrap; }

/* ── CONTENT DARK (cards) ── */
.content-wrap { display: flex; flex-direction: column; padding: 52px 68px 100px; height: 100%; }
.top-label { display: inline-block; background: rgba(27,158,138,0.25); border: 1px solid var(--teal); border-radius: 6px; padding: 6px 18px; font-size: 14px; font-weight: 600; color: var(--teal2); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; align-self: flex-start; }
.content-h2 { font-family: 'Playfair Display', serif; font-size: 46px; font-weight: 700; color: var(--white); line-height: 1.15; margin-bottom: 10px; }
.content-italic { font-size: 22px; color: var(--muted); font-style: italic; margin-bottom: 28px; }
.amber-bar { width: 72px; height: 3px; background: var(--amber); border-radius: 2px; margin-bottom: 28px; }
.card-stack { display: flex; flex-direction: column; gap: 16px; flex: 1; }
.card-row { background: rgba(255,255,255,0.06); border-radius: 10px; padding: 18px 22px; display: flex; align-items: flex-start; gap: 18px; border: 1.5px solid rgba(255,255,255,0.09); }
.card-row.t { border-color: var(--teal); }
.card-row.a { border-color: var(--amber); }
.card-row.c { border-color: var(--coral); }
.card-num-circle { min-width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: var(--white); flex-shrink: 0; }
.card-body-title { font-size: 22px; font-weight: 700; color: var(--white); margin-bottom: 5px; }
.card-body-text { font-size: 20px; color: var(--offwhite); line-height: 1.5; font-weight: 300; }

/* ── TACTIC DARK (numbered) ── */
.tactic-wrap { display: flex; flex-direction: column; padding: 48px 68px 100px; height: 100%; }
.tactic-header { display: flex; align-items: center; gap: 16px; margin-bottom: 4px; }
.tactic-badge { width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: var(--white); flex-shrink: 0; }
.tactic-label-text { font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tactic-h2 { font-family: 'Playfair Display', serif; font-size: 50px; font-weight: 700; color: var(--white); line-height: 1.12; margin: 12px 0 8px; }
.tactic-desc { font-size: 21px; color: var(--muted); font-weight: 300; margin-bottom: 24px; line-height: 1.5; }
.highlight-pill { border-radius: 10px; padding: 20px 26px; margin-bottom: 20px; }
.highlight-pill-title { font-size: 23px; font-weight: 700; margin-bottom: 6px; }
.highlight-pill-sub { font-size: 19px; font-style: italic; font-weight: 300; line-height: 1.5; }
.step-rows { display: flex; flex-direction: column; gap: 13px; }
.step-row { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 13px 18px; display: flex; gap: 14px; align-items: center; }
.step-badge { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--white); flex-shrink: 0; }
.step-strong { font-size: 19px; font-weight: 600; color: var(--white); }
.step-normal { font-size: 19px; font-weight: 300; color: var(--offwhite); }

/* ── CLINICAL / WARNING DARK ── */
.clinical-wrap { display: flex; flex-direction: column; padding: 50px 68px 100px; height: 100%; }
.clinical-h2 { font-family: 'Playfair Display', serif; font-size: 46px; font-weight: 700; color: var(--white); line-height: 1.15; margin: 12px 0 26px; }
.flow-row { display: grid; grid-template-columns: 1fr 28px 1fr 28px 1fr; gap: 10px; align-items: center; margin-bottom: 28px; }
.flow-box { border-radius: 10px; padding: 22px 16px; text-align: center; }
.flow-box-label { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
.flow-box-text { font-size: 22px; font-weight: 500; line-height: 1.35; }
.flow-arrow { color: var(--muted); font-size: 28px; text-align: center; }
.evidence-rows { display: flex; flex-direction: column; gap: 13px; }
.evidence-row { background: rgba(255,255,255,0.06); border-radius: 10px; padding: 15px 20px; font-size: 21px; color: var(--offwhite); line-height: 1.5; display: flex; gap: 12px; align-items: flex-start; }
.evi-icon { font-size: 21px; flex-shrink: 0; }

/* ── SUMMARY / CLOSING DARK ── */
.summary-wrap { display: flex; flex-direction: column; padding: 50px 68px 100px; height: 100%; }
.summary-h2 { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700; color: var(--white); margin-bottom: 30px; }
.grid-2x4 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; }
.grid-item { border-radius: 10px; padding: 20px 18px; display: flex; flex-direction: column; gap: 6px; border: 1.5px solid rgba(255,255,255,0.1); }
.grid-item-label { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.grid-item-text { font-size: 20px; font-weight: 500; color: var(--white); line-height: 1.4; }
.cta-strip { background: var(--teal); border-radius: 10px; padding: 20px 26px; margin-top: 18px; }
.cta-strip-text { font-size: 22px; font-weight: 700; color: var(--white); margin-bottom: 4px; }
.cta-strip-sub { font-size: 17px; font-style: italic; color: rgba(255,255,255,0.8); }

/* ── LIGHT: content ── */
.content-light-wrap { display: flex; flex-direction: column; padding: 52px 68px 100px; height: 100%; }
.light-badge { display: inline-block; background: var(--teal); color: var(--white); border-radius: 6px; padding: 6px 18px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; align-self: flex-start; }
.light-h2 { font-family: 'Playfair Display', serif; font-size: 46px; font-weight: 700; color: var(--navy); line-height: 1.15; margin-bottom: 10px; }
.light-italic { font-style: italic; font-size: 22px; color: #888; margin-bottom: 28px; }
.light-amber { width: 70px; height: 3px; background: var(--amber); border-radius: 2px; margin-bottom: 28px; }
.light-cards { display: flex; flex-direction: column; gap: 16px; flex: 1; }
.light-card { background: var(--white); border-radius: 10px; padding: 18px 22px; border-left: 5px solid; display: flex; gap: 16px; align-items: flex-start; }
.light-card-icon { font-size: 26px; flex-shrink: 0; }
.light-card-title { font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
.light-card-text { font-size: 20px; color: #555; line-height: 1.5; }

/* ── LIGHT: comparison 2-col ── */
.compare-wrap { display: flex; flex-direction: column; padding: 52px 68px 100px; height: 100%; }
.compare-h2 { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.compare-italic { font-style: italic; font-size: 21px; color: #888; margin-bottom: 28px; }
.compare-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; flex: 1; }
.compare-col { border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.col-head { padding: 14px 20px; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.col-body { flex: 1; background: var(--white); padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.col-point { display: flex; gap: 10px; align-items: flex-start; font-size: 19px; line-height: 1.5; color: #444; }
.col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
.col-foot { padding: 12px 20px; font-size: 16px; font-style: italic; font-weight: 300; }

/* ── LIGHT: closing / CTA ── */
.close-wrap { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px 80px 100px; height: 100%; }
.close-icon { width: 130px; height: 130px; border-radius: 50%; background: rgba(27,158,138,0.12); border: 2px solid var(--teal); display: flex; align-items: center; justify-content: center; font-size: 60px; margin-bottom: 30px; }
.close-h2 { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 700; color: var(--navy); line-height: 1.12; margin-bottom: 14px; max-width: 800px; }
.close-teal { font-size: 26px; font-weight: 700; color: var(--teal); margin-bottom: 12px; }
.close-desc { font-size: 21px; color: #666; font-style: italic; max-width: 700px; line-height: 1.5; margin-bottom: 30px; }
.close-line { width: 90px; height: 3px; background: var(--teal); border-radius: 2px; margin: 0 auto 24px; }
.close-cta { background: var(--teal); color: var(--white); border-radius: 8px; padding: 16px 48px; font-size: 26px; font-weight: 700; display: inline-block; }

/* ── REFS ── */
.refs-wrap { display: flex; flex-direction: column; padding: 55px 68px 100px; height: 100%; }
.refs-h2 { font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700; color: var(--muted); margin-bottom: 30px; letter-spacing: 0.04em; }
.ref-item { font-size: 20px; color: var(--muted); line-height: 1.65; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.ref-num { color: var(--teal); font-weight: 600; margin-right: 8px; }
</style>
</head>
<body>
<div id="slide-container"></div>
</body>
</html>
