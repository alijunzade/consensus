name: Psikiyatri İçerik Pipeline

on:
  # Manuel tetikleme — konu buradan girilir
  workflow_dispatch:
    inputs:
      topic:
        description: "İçerik konusu (örn: menopozda östrojen patchi ve psikoloji)"
        required: true
        type: string
      dry_run:
        description: "Dry run (gerçek paylaşım yapma)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      schedule_post:
        description: "Paylaşımı zamanla (boş = hemen paylaş)"
        required: false
        type: string

  # Telegram bot ile tetikleme için webhook (opsiyonel)
  repository_dispatch:
    types: [content-request]

jobs:
  create-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: psikiyatri-content/package-lock.json

      - name: Chrome/Chromium kur (Puppeteer için)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            fonts-liberation \
            libappindicator3-1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libnspr4 \
            libnss3 \
            lsb-release \
            xdg-utils

      - name: Bağımlılıkları yükle
        working-directory: psikiyatri-content
        run: npm ci

      - name: Pipeline'ı çalıştır
        working-directory: psikiyatri-content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          CONTENT_TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          SLIDE_COUNT: "14"
        run: node src/pipeline.js "$CONTENT_TOPIC"

      - name: Çıktıları artifact olarak yükle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icerik-${{ github.run_number }}
          path: psikiyatri-content/output/
          retention-days: 30

      - name: Hata bildirimi (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="❌ Pipeline hatası! Run #${{ github.run_number }} — ${{ github.event.inputs.topic }}" \
            -d parse_mode="HTML"

      - name: Başarı bildirimi (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="✅ İçerik hazır! ${{ github.event.inputs.topic }} — Artifact indir: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d parse_mode="HTML"
