name: İçerik Üret

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Konu (örn: menopozda östrojen patchi ve psikoloji)"
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chromium kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser \
            fonts-liberation libappindicator3-1 libasound2 \
            libatk-bridge2.0-0 libnspr4 libnss3

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Pipeline çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_TOPIC: ${{ inputs.topic }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          SLIDE_COUNT: "14"
        run: node pipeline.js "$CONTENT_TOPIC"

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: icerik-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Telegram — başarı
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          TOPIC: ${{ inputs.topic }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="✅ İçerik hazır!

📌 $TOPIC
🖼 Run #$RUN_NUM

📥 https://github.com/$REPO/actions/runs/$RUN_ID

Artifacts → icerik-$RUN_NUM → indir"

      - name: Telegram — hata
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ inputs.topic }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="❌ Hata! Konu: $TOPIC — https://github.com/$REPO/actions/runs/$RUN_ID"
